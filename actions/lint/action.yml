name: Lint
description: Run the language's standard linter. A lint error fails the step. Run the setup action first.
inputs:
  working-directory:
    description: Project directory, relative to the repository root
    default: "."
  language:
    description: node, python, go, java, php or rust (from the detect action)
    required: true
  package_manager:
    description: From the detect action
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LANGUAGE: ${{ inputs.language }}
        PACKAGE_MANAGER: ${{ inputs.package_manager }}
      run: '"$GITHUB_ACTION_PATH/../../scripts/lint.sh" "$LANGUAGE" "$PACKAGE_MANAGER"'
