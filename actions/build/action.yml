name: Build
description: Install dependencies and build the project. Run the setup action first.
inputs:
  working-directory:
    description: Project directory, relative to the repository root
    default: "."
  language:
    description: node, python, go, java, php or rust (from the detect action)
    required: true
  package_manager:
    description: From the detect action
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LANGUAGE: ${{ inputs.language }}
        PACKAGE_MANAGER: ${{ inputs.package_manager }}
      run: '"$GITHUB_ACTION_PATH/../../scripts/build.sh" "$LANGUAGE" "$PACKAGE_MANAGER"'
