name: Deploy with Docker Compose over SSH
description: >-
  Point the host's compose project at a new image and recreate it, waiting for health checks. The host's compose
  file must use image ${IMAGE}. Pass SSH_PRIVATE_KEY and SSH_KNOWN_HOSTS (and REGISTRY_PASSWORD for a private
  image) as env.
inputs:
  host:
    description: SSH host
    required: true
  user:
    description: SSH user (must be allowed to run docker)
    default: deploy
  port:
    description: SSH port
    default: "22"
  path:
    description: Directory on the host that holds compose.yaml
    default: /opt/app
  image:
    description: Image to deploy, ideally by digest (name@sha256:...)
    required: true
  registry:
    description: Registry to log in to before pulling, when REGISTRY_PASSWORD is set
    default: ghcr.io
  registry-username:
    description: Registry user, when REGISTRY_PASSWORD is set
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_USER: ${{ inputs.user }}
        DEPLOY_PORT: ${{ inputs.port }}
        DEPLOY_PATH: ${{ inputs.path }}
        IMAGE: ${{ inputs.image }}
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
      run: '"$GITHUB_ACTION_PATH/../../scripts/deploy-compose-ssh.sh"'
