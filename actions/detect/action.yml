name: Detect project
description: Detect the project's language, package manager and whether it has a Dockerfile.
inputs:
  working-directory:
    description: Project directory, relative to the repository root
    default: "."
  language:
    description: Skip detection and use this language (node, python, go, java, php, rust)
    default: ""
outputs:
  language:
    description: node, python, go, java, php or rust
    value: ${{ steps.detect.outputs.language }}
  package_manager:
    description: npm, pnpm or yarn for Node; maven or gradle for Java; empty otherwise
    value: ${{ steps.detect.outputs.package_manager }}
  has_dockerfile:
    description: "'true' when the project directory has a Dockerfile"
    value: ${{ steps.detect.outputs.has_dockerfile }}
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LANGUAGE: ${{ inputs.language }}
      run: '"$GITHUB_ACTION_PATH/../../scripts/detect.sh" "$LANGUAGE"'
