# Keeps every pinned action and the fixture's base image current. Pins stay SHAs; Dependabot moves them.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /tests/fixtures/node
    schedule:
      interval: weekly
    # Stay on the Node major the pipeline defaults to (the current LTS); moving to the next LTS is a decision,
    # not a weekly bump.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
