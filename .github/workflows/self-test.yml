# Proves the pipeline does what the README says, on every push and once a week (so a new toolchain or action
# release that breaks it shows up here, not in a caller's repository):
# - lint: actionlint on the workflows, shellcheck on the scripts, every action pinned to a real commit;
# - languages: for each of the six stacks, detect, set up, build, lint and test a tiny project, then run the
#   tests again with one forced failure and require the step to FAIL (a pipeline that cannot go red is useless);
# - pipeline: run the reusable workflow itself end to end on the Node project, including the image build;
# - deploy: deploy an image over SSH to a Docker Compose project on the runner and check the app answers.
name: self-test
on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: Every action is pinned to a commit SHA that exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An annotated tag object's SHA looks like a commit SHA but fails when a job runs, so ask the API.
          # Only real `uses:` keys, not usage examples in comments.
          refs=$(grep -rhE '^[[:space:]]*(- )?uses: *[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@' .github actions \
            | sed -E 's/^[[:space:]]*(- )?uses: *//; s/[[:space:]].*$//' | sort -u)
          status=0
          while IFS=@ read -r ref sha; do
            repo=$(echo "$ref" | cut -d/ -f1-2)
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "FAIL $ref@$sha is not pinned to a SHA"; status=1
            elif gh api "repos/$repo/commits/$sha" --jq .sha >/dev/null 2>&1; then echo "ok   $ref@$sha"
            else echo "FAIL $ref@$sha is not a commit"; status=1; fi
          done <<< "$refs"
          exit "$status"

  languages:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [node, python, go, java, php, rust]
    env:
      PROJECT: tests/fixtures/${{ matrix.language }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        uses: ./actions/detect
        with:
          working-directory: ${{ env.PROJECT }}
      - name: Detected the right language
        env:
          GOT: ${{ steps.detect.outputs.language }}
          WANT: ${{ matrix.language }}
        run: test "$GOT" = "$WANT" || { echo "detected $GOT, want $WANT"; exit 1; }
      - uses: ./actions/setup
        with:
          working-directory: ${{ env.PROJECT }}
          language: ${{ steps.detect.outputs.language }}
          package_manager: ${{ steps.detect.outputs.package_manager }}
      - uses: ./actions/build
        with:
          working-directory: ${{ env.PROJECT }}
          language: ${{ steps.detect.outputs.language }}
          package_manager: ${{ steps.detect.outputs.package_manager }}
      - uses: ./actions/lint
        with:
          working-directory: ${{ env.PROJECT }}
          language: ${{ steps.detect.outputs.language }}
          package_manager: ${{ steps.detect.outputs.package_manager }}
      - uses: ./actions/test
        with:
          working-directory: ${{ env.PROJECT }}
          language: ${{ steps.detect.outputs.language }}
          package_manager: ${{ steps.detect.outputs.package_manager }}
      - name: Tests again, with one forced failure
        id: failing
        continue-on-error: true
        uses: ./actions/test
        env:
          FIXTURE_FAIL: "1"
        with:
          working-directory: ${{ env.PROJECT }}
          language: ${{ steps.detect.outputs.language }}
          package_manager: ${{ steps.detect.outputs.package_manager }}
      - name: The forced failure must fail the step
        env:
          OUTCOME: ${{ steps.failing.outcome }}
        run: |
          test "$OUTCOME" = failure || { echo "a failing test did not fail the step (outcome $OUTCOME)"; exit 1; }

  # The scan the pipeline runs must pass a clean project and FAIL a vulnerable one and a leaked secret. The bad
  # inputs are generated here at run time, so the repository itself never contains them.
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clean project passes
        uses: ./actions/scan
        with:
          working-directory: tests/fixtures/node
          secrets-path: tests/fixtures/node
      - name: Make a project with a known-vulnerable dependency, and a directory with a leaked key
        run: |
          mkdir -p vulnerable-project leak-dir
          # lodash 4.17.20: CVE-2021-23337 (command injection, HIGH), fixed in 4.17.21.
          (cd vulnerable-project && npm init -y >/dev/null && npm install --package-lock-only --no-audit --no-fund lodash@4.17.20 >/dev/null)
          # A syntactically valid but fake GitHub token, made at run time so it never lands in git.
          printf 'GITHUB_TOKEN=ghp_%s\n' "$(head -c 400 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)" > leak-dir/.env
      - name: Vulnerable dependency must fail the scan
        id: vulnerable
        continue-on-error: true
        uses: ./actions/scan
        with:
          working-directory: vulnerable-project
          secrets-path: tests/fixtures/node
      - name: Leaked secret must fail the scan
        id: leak
        continue-on-error: true
        uses: ./actions/scan
        with:
          working-directory: tests/fixtures/node
          secrets-path: leak-dir
      - name: Both bad inputs failed
        env:
          VULN: ${{ steps.vulnerable.outcome }}
          LEAK: ${{ steps.leak.outcome }}
        run: |
          test "$VULN" = failure || { echo "Trivy passed a known-vulnerable dependency ($VULN)"; exit 1; }
          test "$LEAK" = failure || { echo "gitleaks passed a leaked token ($LEAK)"; exit 1; }

  pipeline:
    uses: ./.github/workflows/auto-pipeline.yml
    permissions:
      contents: read
      packages: write
    with:
      working_directory: tests/fixtures/node
      image: ghcr.io/${{ github.repository }}/fixture-node
      # Pushes only on pushes to the default branch, which proves the push path with the caller's token.
      push_image: true

  # The way most repositories call it: read-only token, nothing pushed. A job inside the pipeline that asked for
  # more permissions than this would fail at startup, which the full-permission call above cannot catch.
  pipeline-read-only:
    uses: ./.github/workflows/auto-pipeline.yml
    permissions:
      contents: read
    with:
      working_directory: tests/fixtures/node

  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The key pair is throwaway: made here, trusted only by this runner, gone when the job ends.
      - name: Make the runner an SSH deploy target with a Compose project
        id: target
        run: |
          sudo apt-get install -y --no-install-recommends openssh-server >/dev/null
          sudo systemctl start ssh
          ssh-keygen -t ed25519 -N "" -f "$RUNNER_TEMP/deploy_key" -q
          mkdir -p ~/.ssh && cat "$RUNNER_TEMP/deploy_key.pub" >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          mkdir -p "$RUNNER_TEMP/app"
          cat > "$RUNNER_TEMP/app/compose.yaml" <<'YAML'
          services:
            app:
              image: ${IMAGE}
              ports: ["127.0.0.1:3000:3000"]
          YAML
          docker build -t fixture-node:e2e tests/fixtures/node
          {
            echo "known_hosts<<EOF"; ssh-keyscan -t ed25519 127.0.0.1 2>/dev/null; echo "EOF"
            echo "key<<EOF"; cat "$RUNNER_TEMP/deploy_key"; echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: ./actions/deploy
        with:
          host: 127.0.0.1
          user: runner
          path: ${{ runner.temp }}/app
          image: fixture-node:e2e
        env:
          SSH_PRIVATE_KEY: ${{ steps.target.outputs.key }}
          SSH_KNOWN_HOSTS: ${{ steps.target.outputs.known_hosts }}
      - name: The deployed app answers
        run: test "$(curl -fsS http://127.0.0.1:3000/)" = ok
