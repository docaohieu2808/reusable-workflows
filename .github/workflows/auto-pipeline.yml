# Zero-config CI/CD: detect the stack, build, lint, test, scan, build the Docker image, and optionally deploy it
# with Docker Compose over SSH. Call it from another repository:
#
#   jobs:
#     pipeline:
#       uses: docaohieu2808/reusable-workflows/.github/workflows/auto-pipeline.yml@<commit-sha> # v2.x
#       permissions:
#         contents: read
#         packages: write     # only when push_image is true
#
# Each job checks out this repository at the exact commit the caller pinned (job.workflow_sha), so the actions
# and scripts it runs are always the same version as this file.
name: auto-pipeline

on:
  workflow_call:
    inputs:
      working_directory:
        description: Project directory, relative to the repository root
        type: string
        default: "."
      language:
        description: Skip detection and use this language (node, python, go, java, php, rust)
        type: string
        default: ""
      node_version:
        description: Node.js version (an .nvmrc or .node-version wins)
        type: string
        default: "24"
      python_version:
        type: string
        default: "3.14"
      go_version:
        description: Go version (the go directive in go.mod wins)
        type: string
        default: "stable"
      java_version:
        type: string
        default: "25"
      php_version:
        type: string
        default: "8.5"
      skip_lint:
        type: boolean
        default: false
      skip_tests:
        type: boolean
        default: false
      skip_security:
        type: boolean
        default: false
      image:
        description: Image name to build (default ghcr.io/<owner>/<repo>). Built when the project has a Dockerfile.
        type: string
        default: ""
      push_image:
        description: Push the image on pushes to the default branch (needs packages write for ghcr.io)
        type: boolean
        default: false
      deploy:
        description: Deploy the pushed image with Docker Compose over SSH (needs push_image)
        type: boolean
        default: false
      deploy_host:
        type: string
        default: ""
      deploy_user:
        type: string
        default: deploy
      deploy_port:
        type: string
        default: "22"
      deploy_path:
        description: Directory on the host that holds compose.yaml (its image must be ${IMAGE})
        type: string
        default: /opt/app
      environment:
        description: GitHub environment for the deploy job (add required reviewers there to gate deploys)
        type: string
        default: production
    secrets:
      REGISTRY_USERNAME:
        description: User for pushing to a registry other than ghcr.io (ghcr.io uses the job's GITHUB_TOKEN)
        required: false
      REGISTRY_PASSWORD:
        description: Password or token for pushing to a registry other than ghcr.io
        required: false
      DEPLOY_REGISTRY_USERNAME:
        description: User the deploy host logs in with to pull a private image
        required: false
      DEPLOY_REGISTRY_PASSWORD:
        description: Read-only token the deploy host uses to pull a private image (e.g. read:packages)
        required: false
      SSH_PRIVATE_KEY:
        description: Deploy key for deploy_user@deploy_host
        required: false
      SSH_KNOWN_HOSTS:
        description: Host key line(s) for deploy_host (ssh-keyscan output, checked before trusting it)
        required: false
    outputs:
      language:
        value: ${{ jobs.detect.outputs.language }}
      image:
        description: The pushed image by digest, empty when nothing was pushed
        value: ${{ jobs.docker.outputs.image }}

# No workflow-level permissions: they would cap every job, including the image push. Each job below that needs
# only to read says so; the image job runs with whatever the caller grants.
jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      language: ${{ steps.detect.outputs.language }}
      package_manager: ${{ steps.detect.outputs.package_manager }}
      has_dockerfile: ${{ steps.detect.outputs.has_dockerfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - id: detect
        uses: ./.pipeline/actions/detect
        with:
          working-directory: ${{ inputs.working_directory }}
          language: ${{ inputs.language }}

  ci:
    needs: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - uses: ./.pipeline/actions/setup
        with:
          working-directory: ${{ inputs.working_directory }}
          language: ${{ needs.detect.outputs.language }}
          package_manager: ${{ needs.detect.outputs.package_manager }}
          node-version: ${{ inputs.node_version }}
          python-version: ${{ inputs.python_version }}
          go-version: ${{ inputs.go_version }}
          java-version: ${{ inputs.java_version }}
          php-version: ${{ inputs.php_version }}
      - uses: ./.pipeline/actions/build
        with:
          working-directory: ${{ inputs.working_directory }}
          language: ${{ needs.detect.outputs.language }}
          package_manager: ${{ needs.detect.outputs.package_manager }}
      - if: ${{ !inputs.skip_lint }}
        uses: ./.pipeline/actions/lint
        with:
          working-directory: ${{ inputs.working_directory }}
          language: ${{ needs.detect.outputs.language }}
          package_manager: ${{ needs.detect.outputs.package_manager }}
      - if: ${{ !inputs.skip_tests }}
        uses: ./.pipeline/actions/test
        with:
          working-directory: ${{ inputs.working_directory }}
          language: ${{ needs.detect.outputs.language }}
          package_manager: ${{ needs.detect.outputs.package_manager }}

  security:
    if: ${{ !inputs.skip_security }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs before Trivy, which downloads its vulnerability database into the workspace.
      - name: Secrets committed to the working tree
        timeout-minutes: 5
        env:
          GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" dir /repo --redact --no-banner
      # Pinned to a commit: on 2026-03-19 this action's tags were force-pushed to credential-stealing code
      # (CVE-2026-33634). A commit SHA cannot be moved that way.
      - name: Vulnerabilities in dependencies (fails on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working_directory }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  docker:
    needs: [detect, ci, security]
    # Runs when CI passed and the scan passed or was skipped on purpose.
    if: >-
      ${{ always() && needs.detect.outputs.has_dockerfile == 'true' && needs.ci.result == 'success'
      && (needs.security.result == 'success' || needs.security.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No job-level permissions on purpose: a called workflow may not ask for more than its caller grants, so
    # this job runs with the caller's token. Callers that set push_image grant packages: write.
    outputs:
      image: ${{ steps.result.outputs.image }}
      registry: ${{ steps.name.outputs.registry }}
    env:
      PUSH: ${{ inputs.push_image && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: name
        env:
          IMAGE: ${{ inputs.image }}
          REPO: ${{ github.repository }}
        run: |
          image="${IMAGE:-ghcr.io/$REPO}"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"
          echo "registry=${image%%/*}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ steps.name.outputs.registry }}
          username: ${{ steps.name.outputs.registry == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
          password: ${{ steps.name.outputs.registry == 'ghcr.io' && github.token || secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ inputs.working_directory }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: result
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$PUSH" = true ]; then echo "image=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"; fi
          echo "Built $IMAGE ($DIGEST), pushed: $PUSH"

  deploy:
    needs: docker
    if: ${{ inputs.deploy && needs.docker.outputs.image != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment: ${{ inputs.environment }}
    # One deploy at a time per environment; a newer one waits instead of cancelling a deploy halfway.
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - uses: ./.pipeline/actions/deploy
        with:
          host: ${{ inputs.deploy_host }}
          user: ${{ inputs.deploy_user }}
          port: ${{ inputs.deploy_port }}
          path: ${{ inputs.deploy_path }}
          image: ${{ needs.docker.outputs.image }}
          registry: ${{ needs.docker.outputs.registry }}
          registry-username: ${{ secrets.DEPLOY_REGISTRY_USERNAME }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REGISTRY_PASSWORD: ${{ secrets.DEPLOY_REGISTRY_PASSWORD }}
